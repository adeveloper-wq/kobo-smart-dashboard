# ==============================================================================
# Kobo Dashboard - Example Configuration (YAML)
# ==============================================================================

version: 1

device:
  # Kobo model: clara_colour, clara_bw, libra_colour, clara_2e, libra_2,
  # clara_hd, libra_h2o, etc. or "auto"
  model: "auto"

  # "portrait" or "landscape"
  orientation: "portrait"

  # Perform a full flashing e-ink refresh every N screen updates
  full_refresh_cycles: 10

  fb_device: "/dev/fb0"
  touch_device: "auto"

  # Touch axis mapping for Kobo (defaults match Clara Colour and most models)
  swap_touch_xy: true
  invert_touch_x: true
  invert_touch_y: false

  # Framebuffer rotation ("auto", 0, 90, 180, 270)
  fb_rotation: "auto"
  landscape_rotation: 90

  # Color e-ink panel (Kaleido)
  color_panel: true

  # Turn frontlight off after N seconds of inactivity (0 = disabled)
  frontlight_timeout_secs: 0

  # Sleep mode: suspend device after N seconds of inactivity
  # (0 = disabled; active on battery power)
  sleep_after_secs: 180
  # Wake up and refresh interval (seconds)
  sleep_wake_secs: 1800

backend:
  # URL of the Python backend on your local server (e.g. Ubuntu)
  url: "http://192.168.1.100:8000"
  enabled: true

theme:
  # "kaleido" (color), "high_contrast_bw", "paper_warm" or "dark"
  mode: "kaleido"
  accent_color: "#D97706"
  card_corner_radius: 18.0
  # "24h" or "12h"
  time_format: "24h"
  # Language for the dashboard
  language: "de"
  # Timezone offset for Kobo (Nickel clock runs in UTC)
  utc_offset: "+01:00"

# Pages and cards are dynamically controlled by the Python backend.
# Local fallback page:
pages:
  - id: "main"
    title: "Übersicht"
    icon: "home"
    cards:
      - type: "greeting"
        title: "Willkommen"
        subtitle: "Lade Dashboard..."
        icon: "sun"
      - type: "weather"
        forecast_days: 3
      - type: "calendar"
        title: "Heutige Termine"
        events: []
      - type: "humidity"
        title: "Luftfeuchtigkeit"
        value: "--"
        unit: "%"
        status: "Lade..."
