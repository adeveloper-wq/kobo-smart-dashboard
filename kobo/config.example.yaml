# ==============================================================================
# Kobo Dashboard - Example Configuration (YAML)
# ==============================================================================

version: 1

device:
  # Kobo model: clara_colour, clara_bw, libra_colour, clara_2e, libra_2,
  # clara_hd, libra_h2o, etc. or "auto"
  model: "auto"

  # Horizontal orientation (only supported mode)
  orientation: "landscape"

  # Perform a full flashing e-ink refresh every N screen updates
  full_refresh_cycles: 10

  fb_device: "/dev/fb0"
  touch_device: "auto"

  # Touch axis mapping for Kobo (defaults match Clara Colour and most models)
  swap_touch_xy: true
  invert_touch_x: true
  invert_touch_y: false

  # Framebuffer rotation ("auto", 0, 90, 180, 270)
  fb_rotation: "auto"
  landscape_rotation: 90

  # Black and white panel
  color_panel: false

  # Turn frontlight off after N seconds of inactivity (0 = disabled)
  frontlight_timeout_secs: 0

backend:
  # URL of the Python backend on your local server (e.g. Ubuntu).
  # Deep sleep, wake intervals, and schedules are managed entirely by the backend.
  url: "http://192.168.1.100:8000"
  enabled: true

theme:
  # High-contrast black and white mode (only supported mode)
  mode: "high_contrast_bw"
  card_corner_radius: 18.0
  # "24h" or "12h"
  time_format: "24h"
  # Language for the dashboard
  language: "de"
  # Timezone offset for Kobo (Nickel clock runs in UTC)
  utc_offset: "+01:00"

# Pages and cards are dynamically controlled by the Python backend.
# Local fallback page:
pages:
  - id: "main"
    title: "Übersicht"
    icon: "home"
    cards:
      - type: "greeting"
        title: "Willkommen"
        subtitle: "Lade Dashboard..."
        icon: "sun"
      - type: "weather"
        forecast_days: 4
      - type: "calendar"
        title: "Person 1"
        events: []
      - type: "calendar"
        title: "Person 2"
        events: []
